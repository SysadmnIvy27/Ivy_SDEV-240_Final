name: Build WinForms App

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore Ivy_C#_SDEV_Final.slnx

    - name: Build Solution
      run: msbuild Ivy_C#_SDEV_Final.slnx /p:Configuration=Release
